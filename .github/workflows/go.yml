name: Go

on:
  push:
    branches: [ "*" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    strategy:
      matrix:
        # GitHub provides free native runners for all three OS for public repos
        os: [ ubuntu-latest, macos-latest, windows-latest ]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Build desktop app
        run: go build -o us3ui${{ runner.os == 'Windows' && '.exe' || '' }} ./cmd/desktop/

      - name: Vet
        run: go vet ./... && go tool mygo vet .

      - name: Test
        run: go test -v ./...
